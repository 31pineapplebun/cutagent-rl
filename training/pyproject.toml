[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cutagent-training"
version = "0.1.0"
description = "Isolated post-training backends for CutAgent-RL"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cutagent-evaluation==0.1.0",
  "cutagent-rl==0.1.0",
  "ms-swift==4.5.2",
  "numpy>=2.4,<3",
  "pydantic>=2.10,<3",
  "qwen-vl-utils==0.0.14",
  "decord==0.6.0",
  "datasets==4.8.4",
  "peft==0.19.1",
  "torch==2.12.1",
  "torchvision==0.27.1",
  "transformers==5.15.1",
  "trl==0.29.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cutagent_training"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
cutagent-evaluation = { path = "../evaluation", editable = true }
cutagent-rl = { path = "..", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
